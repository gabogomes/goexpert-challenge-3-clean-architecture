services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_PASSWORD: root
    ports:
      - 3306:3306
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: "no"

  ordersystem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordersystem
    depends_on:
      - mysql
      - rabbitmq
    ports:
      - "8080:8080"
      - "8000:8000"
      - "50051:50051"
    command: /bin/sh -c "sleep 15 && /app/ordersystem"
    restart: "no"